name: Deploy staging

# Deploys the branch to the staging VPS over SSH, then smoke-tests it from the outside.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   STAGING_SSH_HOST         VPS IP or hostname
#   STAGING_SSH_USER         SSH user with sudo/root (e.g. root)
#   STAGING_SSH_KEY          private key (ed25519) whose public key is in the VPS authorized_keys
#   STAGING_ENV              full contents of deploy/staging.env (see deploy/staging.env.example)
# Optional:
#   STAGING_SSH_PORT         default 22
#   STAGING_SSH_KNOWN_HOSTS  output of `ssh-keyscan <host>`; pins the host key (recommended)

on:
  workflow_dispatch:
  push:
    branches: [claude/law-office-ai-agent-c8ckgb]
    paths-ignore: ['**.md']

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Loads secrets defined on the "staging" environment in addition to repository secrets.
    environment: staging
    steps:
      - name: Check configuration
        id: cfg
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST || vars.STAGING_SSH_HOST }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          ENVFILE: ${{ secrets.STAGING_ENV }}
          # Names only (never values) — helps diagnose secrets saved in the wrong place or under another name.
          SECRET_NAMES: ${{ toJSON(secrets) }}
          VAR_NAMES: ${{ toJSON(vars) }}
        run: |
          echo "Secret yang terlihat oleh workflow: $(printf '%s' "$SECRET_NAMES" | jq -r 'keys | join(", ")')"
          echo "Variable yang terlihat oleh workflow: $(printf '%s' "$VAR_NAMES" | jq -r 'keys | join(", ")')"
          unset SECRET_NAMES
          missing=""
          [ -n "$HOST" ] || missing="$missing STAGING_SSH_HOST"
          [ -n "$KEY" ] || missing="$missing STAGING_SSH_KEY"
          [ -n "$ENVFILE" ] || missing="$missing STAGING_ENV"
          if [ -n "$missing" ]; then
            echo "::notice::Secret belum terbaca:$missing — deploy dilewati. Isi di Settings → Secrets and variables → Actions → tab Secrets (Repository secrets atau environment 'staging')."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - name: Test before deploying
        if: steps.cfg.outputs.ready == 'true'
        run: npm ci && npm test

      - name: Prepare SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST || vars.STAGING_SSH_HOST }}
          PORT: ${{ secrets.STAGING_SSH_PORT || vars.STAGING_SSH_PORT }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER || vars.STAGING_SSH_USER || 'root' }}
        run: |
          # Tolerate copy-paste artefacts: surrounding whitespace/newlines, "user@host", "host:port".
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | head -n1; }
          HOST=$(trim "$HOST"); PORT=$(trim "$PORT"); SSH_USER=$(trim "$SSH_USER")
          HOST="${HOST#ssh://}"; HOST="${HOST%/}"
          case "$HOST" in *[[:space:]]*) second=$(printf '%s' "$HOST" | awk '{print $2}'); HOST=$(printf '%s' "$HOST" | awk '{print $1}')
            printf '%s' "$second" | grep -Eq '^[0-9]+$' && PORT="${PORT:-$second}";; esac
          case "$HOST" in *@*) SSH_USER="${HOST%@*}"; HOST="${HOST#*@}";; esac
          case "$HOST" in *:*:*) ;; *:*) PORT="${PORT:-${HOST##*:}}"; HOST="${HOST%:*}";; esac
          if ! printf '%s' "$HOST" | grep -Eq '^[A-Za-z0-9.:-]+$'; then
            echo "::error::STAGING_SSH_HOST tidak valid. Isi hanya IP atau hostname VPS (tanpa spasi), mis. 103.10.20.30"; exit 1
          fi
          if [ -n "$PORT" ] && ! printf '%s' "$PORT" | grep -Eq '^[0-9]+$'; then
            echo "::error::STAGING_SSH_PORT harus berupa angka."; exit 1
          fi
          if ! printf '%s\n' "$KEY" | grep -q 'PRIVATE KEY-----'; then
            echo "::error::STAGING_SSH_KEY bukan kunci privat (harus diawali -----BEGIN OPENSSH PRIVATE KEY-----). Pastikan yang diisi file deploy_staging, bukan deploy_staging.pub."; exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else ssh-keyscan -p "${PORT:-22}" -T 15 "$HOST" > ~/.ssh/known_hosts; echo "::warning::STAGING_SSH_KNOWN_HOSTS belum diisi; host key dipercaya saat pertama terhubung."; fi
          printf 'Host staging\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n' \
            "$HOST" "${PORT:-22}" "$SSH_USER" > ~/.ssh/config
          ssh -o BatchMode=yes -o ConnectTimeout=20 staging 'echo "SSH OK: $(hostname) · $(. /etc/os-release && echo $PRETTY_NAME)"' || {
            echo "::error::SSH ke VPS gagal. Periksa: kunci publik deploy_staging.pub sudah ada di ~/.ssh/authorized_keys user tersebut, port SSH terbuka, dan IP benar."; exit 1; }

      - name: Upload configuration & deploy
        if: steps.cfg.outputs.ready == 'true'
        env:
          ENVFILE: ${{ secrets.STAGING_ENV }}
          SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$ENVFILE" | ssh staging 'umask 077; cat > /root/kantor-staging.env'
          scp -q deploy/install-staging.sh staging:/root/install-staging.sh
          ssh staging "sudo ENV_SOURCE=/root/kantor-staging.env BRANCH='${GITHUB_REF_NAME}' bash /root/install-staging.sh </dev/null"
          ssh staging "cd /opt/kantor && echo \"Revisi di server: \$(git rev-parse --short HEAD) (diharapkan ${SHA::7})\""

      - name: Smoke test from the internet
        if: steps.cfg.outputs.ready == 'true'
        env:
          ENVFILE: ${{ secrets.STAGING_ENV }}
        run: |
          val() { printf '%s\n' "$ENVFILE" | grep -E "^$1=" | head -1 | cut -d= -f2- | sed -e "s/^'//" -e "s/'$//" -e 's/^"//' -e 's/"$//'; }
          DOMAIN=$(val STAGING_DOMAIN); USER=$(val STAGING_BASIC_AUTH_USER); PASS=$(val STAGING_BASIC_AUTH_PASSWORD); VERIFY=$(val WA_META_VERIFY_TOKEN)
          echo "::add-mask::$PASS"
          for i in $(seq 1 24); do curl -fsS "https://$DOMAIN/healthz" >/dev/null 2>&1 && break; echo "menunggu HTTPS… ($i)"; sleep 10; done
          if [ -n "$PASS" ]; then bash deploy/smoke-test.sh "https://$DOMAIN" "$USER" "$PASS" "$VERIFY"
          else curl -fsS "https://$DOMAIN/healthz"; echo; echo "::notice::STAGING_BASIC_AUTH_PASSWORD tidak ada di STAGING_ENV — smoke test lengkap dilewati."; fi

      - name: Recent application logs
        if: always() && steps.cfg.outputs.ready == 'true'
        run: ssh staging 'cd /opt/kantor/deploy && docker compose -f docker-compose.staging.yml --env-file staging.env logs --tail=60 app caddy' || true
