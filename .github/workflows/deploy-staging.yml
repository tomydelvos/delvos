name: Deploy staging

# Deploys the branch to the staging VPS, then verifies it from the internet.
# Two ways the new revision reaches the VPS:
#   ssh  — this GitHub-hosted runner connects over SSH and runs the installer (SSH port must be reachable).
#   pull — the VPS updates itself: install-staging.sh installs a systemd timer (deploy/auto-update.sh) that
#          redeploys whenever this branch moves. Nothing here runs on the VPS; this workflow only waits until
#          /healthz reports the new revision and smoke-tests it. Needs no inbound SSH.
# "auto" (default) probes the SSH port and uses pull when it is unreachable.
# Override with the dispatch input or the repository variable STAGING_DEPLOY_VIA (auto|ssh|pull).
#
# Secrets (Settings → Secrets and variables → Actions, repository or environment "staging"):
#   STAGING_ENV              contents of deploy/staging.env — always required (domain + smoke-test login)
#   STAGING_SSH_HOST         public IP or hostname of the VPS             ┐
#   STAGING_SSH_KEY          private key whose .pub is in authorized_keys  ├ ssh only
#   STAGING_SSH_USER         default root                                 │
#   STAGING_SSH_PORT         default 22                                   │
#   STAGING_SSH_KNOWN_HOSTS  output of `ssh-keyscan -p <port> <ip>`        ┘ (recommended)

on:
  workflow_dispatch:
    inputs:
      via:
        description: 'Jalur deploy (default = variable STAGING_DEPLOY_VIA, atau auto)'
        type: choice
        options: [default, auto, ssh, pull]
        default: default
  push:
    branches: [claude/law-office-ai-agent-c8ckgb]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Loads secrets defined on the "staging" environment in addition to repository secrets.
    environment: staging
    outputs:
      ready: ${{ steps.cfg.outputs.ready }}
      via: ${{ steps.decide.outputs.via }}
    steps:
      - name: Check configuration
        id: cfg
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST || vars.STAGING_SSH_HOST }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          ENVFILE: ${{ secrets.STAGING_ENV }}
          # Names only (never values) — helps diagnose secrets saved in the wrong place or under another name.
          SECRET_NAMES: ${{ toJSON(secrets) }}
          VAR_NAMES: ${{ toJSON(vars) }}
        run: |
          echo "Secret yang terlihat oleh workflow: $(printf '%s' "$SECRET_NAMES" | jq -r 'keys | join(", ")')"
          echo "Variable yang terlihat oleh workflow: $(printf '%s' "$VAR_NAMES" | jq -r 'keys | join(", ")')"
          unset SECRET_NAMES
          if [ -z "$ENVFILE" ]; then
            echo "::notice::Secret STAGING_ENV belum terbaca — deploy dilewati. Isi di Settings → Secrets and variables → Actions → tab Secrets (Repository secrets atau environment 'staging')."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ -n "$HOST" ] && [ -n "$KEY" ]; then echo "has_ssh=true" >> "$GITHUB_OUTPUT"
          else echo "has_ssh=false" >> "$GITHUB_OUTPUT"; echo "STAGING_SSH_HOST/STAGING_SSH_KEY belum lengkap — hanya jalur pull yang tersedia."; fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Test before deploying
        if: steps.cfg.outputs.ready == 'true'
        run: npm ci && npm test

      - name: Diagnose network to the VPS
        id: net
        if: steps.cfg.outputs.ready == 'true' && steps.cfg.outputs.has_ssh == 'true'
        # Informational: a malformed SSH secret must not block the pull path.
        continue-on-error: true
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST || vars.STAGING_SSH_HOST }}
          PORT: ${{ secrets.STAGING_SSH_PORT || vars.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER || vars.STAGING_SSH_USER }}
          KNOWN: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          ENVFILE: ${{ secrets.STAGING_ENV }}
        run: |
          . deploy/ssh-target.sh
          DOMAIN=$(printf '%s\n' "$ENVFILE" | grep -E '^STAGING_DOMAIN=' | head -1 | cut -d= -f2- | tr -d "'\"\r ")
          known=""; if [ -n "$KNOWN" ]; then known=$(mktemp); printf '%s\n' "$KNOWN" | tr -d '\r' > "$known"; fi
          bash deploy/diagnose-network.sh "$HOST" "$PORT" "$DOMAIN" "$known" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Choose deploy path
        id: decide
        if: steps.cfg.outputs.ready == 'true'
        env:
          INPUT_VIA: ${{ inputs.via }}
          VAR_VIA: ${{ vars.STAGING_DEPLOY_VIA }}
          HAS_SSH: ${{ steps.cfg.outputs.has_ssh }}
          SSH_REACHABLE: ${{ steps.net.outputs.ssh_reachable }}
        run: |
          requested="$INPUT_VIA"; case "$requested" in ''|default) requested="${VAR_VIA:-auto}";; esac
          case "$requested" in
            ssh)
              [ "$HAS_SSH" = true ] || { echo "::error::Jalur ssh dipilih tetapi STAGING_SSH_HOST/STAGING_SSH_KEY belum diisi."; exit 1; }
              via=ssh ;;
            pull) via=pull ;;
            auto)
              if [ "$SSH_REACHABLE" = true ]; then via=ssh
              else
                via=pull
                msg="SSH ke VPS tidak terjangkau dari GitHub — memakai jalur pull: menunggu VPS men-deploy sendiri lewat auto-update. Bila auto-update belum dipasang, jalankan installer sekali di VPS (lihat deploy/DEPLOY-STAGING.md)."
                echo "::notice::$msg"; printf '\n**%s**\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
              fi ;;
            *) echo "::error::STAGING_DEPLOY_VIA harus auto, ssh, atau pull (sekarang: $requested)."; exit 1 ;;
          esac
          echo "Jalur deploy: $via"
          echo "via=$via" >> "$GITHUB_OUTPUT"

  deploy-ssh:
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.via == 'ssh'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST || vars.STAGING_SSH_HOST }}
          PORT: ${{ secrets.STAGING_SSH_PORT || vars.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER || vars.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          . deploy/ssh-target.sh
          if ! printf '%s\n' "$KEY" | grep -q 'PRIVATE KEY-----'; then
            echo "::error::STAGING_SSH_KEY bukan kunci privat (harus diawali -----BEGIN OPENSSH PRIVATE KEY-----). Pastikan yang diisi file deploy_staging, bukan deploy_staging.pub."; exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" | tr -d '\r' > ~/.ssh/known_hosts
          else ssh-keyscan -p "$PORT" -T 15 "$HOST" > ~/.ssh/known_hosts; echo "::warning::STAGING_SSH_KNOWN_HOSTS belum diisi; host key dipercaya saat pertama terhubung."; fi
          printf 'Host staging\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  ConnectTimeout 20\n  ServerAliveInterval 30\n  ServerAliveCountMax 6\n' \
            "$HOST" "$PORT" "$SSH_USER" > ~/.ssh/config
          ssh -o BatchMode=yes staging 'echo "SSH OK: $(hostname) · $(. /etc/os-release && echo $PRETTY_NAME)"' || {
            echo "::error::SSH ke VPS gagal. Periksa: kunci publik deploy_staging.pub sudah ada di ~/.ssh/authorized_keys user tersebut, port SSH terbuka, dan IP benar — atau pakai jalur pull (deploy/DEPLOY-STAGING.md)."; exit 1; }

      - name: Upload configuration & deploy
        env:
          ENVFILE: ${{ secrets.STAGING_ENV }}
          SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$ENVFILE" | ssh staging 'umask 077; cat > /root/kantor-staging.env'
          scp -q deploy/install-staging.sh staging:/root/install-staging.sh
          ssh staging "sudo ENV_SOURCE=/root/kantor-staging.env BRANCH='${GITHUB_REF_NAME}' bash /root/install-staging.sh </dev/null"
          ssh staging "cd /opt/kantor && echo \"Revisi di server: \$(git rev-parse --short HEAD) (diharapkan ${SHA::7})\""

      # Container state and error lines only: full app logs can contain client data and first-run passwords,
      # and this repository's Actions logs are public.
      - name: Container status
        if: always()
        run: |
          ssh -o BatchMode=yes staging 'cd /opt/kantor/deploy && docker compose -f docker-compose.staging.yml --env-file staging.env ps &&
            docker compose -f docker-compose.staging.yml --env-file staging.env logs --tail=200 app caddy 2>&1 |
            grep -iE "error|fatal|fail|exception|refused" | grep -viE "password|sandi|token|secret|@" | tail -20' || true

  verify:
    needs: [plan, deploy-ssh]
    if: always() && needs.plan.outputs.ready == 'true' && (needs.deploy-ssh.result == 'success' || needs.plan.outputs.via == 'pull')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the new revision
        env:
          ENVFILE: ${{ secrets.STAGING_ENV }}
          SHA: ${{ github.sha }}
          VIA: ${{ needs.plan.outputs.via }}
        run: |
          DOMAIN=$(printf '%s\n' "$ENVFILE" | grep -E '^STAGING_DOMAIN=' | head -1 | cut -d= -f2- | tr -d "'\"\r ")
          # Pull deploys rebuild on the VPS (timer every 2 min + build); SSH deploys are already done.
          [ "$VIA" = pull ] && tries=100 || tries=24
          seen=""
          for i in $(seq 1 "$tries"); do
            rev=$(curl -fsS -m 10 "https://$DOMAIN/healthz" 2>/dev/null | jq -r '.revision // empty' 2>/dev/null || true)
            [ -n "$rev" ] && seen=yes
            # Accept this run's commit or a newer tip of the branch (a later push may already be deployed).
            tip=$(git ls-remote -q "https://github.com/$GITHUB_REPOSITORY" "refs/heads/$GITHUB_REF_NAME" | cut -c1-40)
            if [ -n "$rev" ] && { case "$SHA" in "$rev"*) true;; *) false;; esac || case "$tip" in "$rev"*) true;; *) false;; esac; }; then
              echo "Revisi yang berjalan: $rev ✓"; exit 0
            fi
            echo "menunggu… ($i/$tries) revisi sekarang: ${rev:-tidak terjangkau}"; sleep 15
          done
          if [ -z "$seen" ]; then
            echo "::error::https://$DOMAIN/healthz tidak terjangkau dari internet. Periksa record A domain → IP publik VPS dan port 80/443 di firewall penyedia (dibutuhkan Let's Encrypt & webhook Meta)."
          elif [ "$VIA" = pull ]; then
            echo "::error::VPS belum men-deploy ${SHA::7}. Pastikan auto-update terpasang (installer di VPS) dan lihat log di VPS: journalctl -u kantor-auto-update -n 100"
          else
            echo "::error::Revisi yang berjalan tidak sama dengan ${SHA::7} — kontainer lama masih berjalan atau domain mengarah ke server lain."
          fi
          exit 1

      - name: Smoke test from the internet
        env:
          ENVFILE: ${{ secrets.STAGING_ENV }}
        run: |
          val() { printf '%s\n' "$ENVFILE" | grep -E "^$1=" | head -1 | cut -d= -f2- | tr -d '\r' | sed -e "s/^'//" -e "s/'$//" -e 's/^"//' -e 's/"$//'; }
          DOMAIN=$(val STAGING_DOMAIN); USER=$(val STAGING_BASIC_AUTH_USER); PASS=$(val STAGING_BASIC_AUTH_PASSWORD); VERIFY=$(val WA_META_VERIFY_TOKEN)
          [ -n "$PASS" ] && echo "::add-mask::$PASS"
          [ -n "$VERIFY" ] && echo "::add-mask::$VERIFY"
          if [ -n "$PASS" ]; then bash deploy/smoke-test.sh "https://$DOMAIN" "$USER" "$PASS" "$VERIFY"
          else curl -fsS "https://$DOMAIN/healthz"; echo; echo "::notice::STAGING_BASIC_AUTH_PASSWORD tidak ada di STAGING_ENV — smoke test lengkap dilewati."; fi
          {
            echo "### Staging berjalan"
            echo "- Situs: https://$DOMAIN"
            echo "- Panel admin: https://$DOMAIN/admin/"
            echo "- Webhook WhatsApp: https://$DOMAIN/webhooks/whatsapp"
          } >> "$GITHUB_STEP_SUMMARY"
